name: Sync Jadwal & Cek Nilai SIAKAD ITHB

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

# Mencegah dua proses berjalan bersamaan (menghindari jadwal ganda)
concurrency:
  group: sync-ithb-calendar
  cancel-in-progress: false

jobs:
  sync-schedule:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run sync script
        env:
          SIAKAD_URL: ${{ secrets.SIAKAD_URL }}
          SIAKAD_NIM: ${{ secrets.SIAKAD_NIM }}
          SIAKAD_PASS: ${{ secrets.SIAKAD_PASS }}
          GOOGLE_TOKEN_JSON: ${{ secrets.GOOGLE_TOKEN_JSON }}
          GOOGLE_CALENDAR_ID: ${{ secrets.GOOGLE_CALENDAR_ID }}
        run: python sync_ithb.py

      - name: Cek Update Nilai KHS ke Telegram
        env:
          SIAKAD_URL: ${{ secrets.SIAKAD_URL }}
          SIAKAD_NIM: ${{ secrets.SIAKAD_NIM }}
          SIAKAD_PASS: ${{ secrets.SIAKAD_PASS }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python check_grades.py

      - name: Commit perubahan state nilai
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add grades_state.json || true
          git diff --staged --quiet || git commit -m "chore: update grades state"
          git push